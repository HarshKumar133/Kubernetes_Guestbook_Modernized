; OPcache Configuration for Kubernetes Guestbook Modernized
; Optimized OPcache settings for production environment

[opcache]
; Enable OPcache
opcache.enable = 1
opcache.enable_cli = 1

; Memory settings
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000

; Performance settings
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.enable_file_override = 0

; Error handling
opcache.log_verbosity_level = 1
opcache.error_log = /var/log/php-fpm/opcache.log

; Blacklist (if needed)
opcache.blacklist_filename = /etc/php/opcache-blacklist.txt

; File cache
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1

; Optimization
opcache.optimization_level = 0x7FFFBFFF
opcache.inherited_hack = 1
opcache.dups_fix = 0
opcache.load_comments = 1
opcache.save_comments = 1
opcache.enable_file_override = 0
opcache.optimization_level = 0x7FFFBFFF
opcache.inherited_hack = 1
opcache.dups_fix = 0
opcache.load_comments = 1
opcache.save_comments = 1
opcache.enable_file_override = 0
