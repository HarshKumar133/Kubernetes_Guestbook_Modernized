name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: guestbook-modernized-registry

jobs:
  # Lint and validate code
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: |
          cd infrastructure
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infrastructure
          terraform init -backend=false
          terraform validate

      - name: Helm Lint
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Lint Helm Charts
        run: |
          helm lint helm/guestbook

      - name: Validate Helm Templates
        run: |
          helm template guestbook helm/guestbook --values helm/guestbook/values-dev.yaml --dry-run

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/security
            p/php
            p/docker
            p/kubernetes
            p/terraform

      - name: Run Checkov for IaC security
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # Build and test Docker images
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [lint, security]
    strategy:
      matrix:
        component: [frontend, redis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./applications/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.component }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  # Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Create test namespace
        run: kubectl create namespace guestbook-test --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy test application
        run: |
          helm install guestbook-test helm/guestbook \
            --namespace guestbook-test \
            --values helm/guestbook/values-dev.yaml \
            --set app.image.tag=${{ github.sha }} \
            --wait --timeout=300s

      - name: Run integration tests
        run: |
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=guestbook -n guestbook-test --timeout=300s
          
          # Get service URL
          SERVICE_IP=$(kubectl get svc guestbook-test -n guestbook-test -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          # Test health endpoint
          curl -f http://$SERVICE_IP/health || exit 1
          
          # Test main page
          curl -f http://$SERVICE_IP/ || exit 1

      - name: Run load tests
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load-test.js

      - name: Cleanup test resources
        if: always()
        run: |
          helm uninstall guestbook-test -n guestbook-test || true
          kubectl delete namespace guestbook-test || true

  # Compliance testing
  compliance:
    name: Compliance Testing
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OPA Conftest
        uses: instrumenta/conftest-action@master
        with:
          files: |
            helm/guestbook/templates/
            infrastructure/
          policy: policies/
          fail-fast: true

      - name: Run Kyverno policy validation
        uses: kyverno/kyverno-cli-action@v1
        with:
          policy: policies/kyverno/
          resource: helm/guestbook/templates/

      - name: GDPR Compliance Check
        run: |
          # Check for PII in logs
          grep -r "password\|email\|phone" applications/ || echo "No PII found in application code"
          
          # Check for data retention policies
          grep -r "retention\|expire" helm/guestbook/ || echo "No retention policies found"

  # Generate security report
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security, build, compliance]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate security report
        run: |
          echo "# Security Scan Report" > security-report.md
          echo "## Scan Results" >> security-report.md
          echo "- Trivy: ${{ needs.security.result }}" >> security-report.md
          echo "- Semgrep: ${{ needs.security.result }}" >> security-report.md
          echo "- Checkov: ${{ needs.security.result }}" >> security-report.md
          echo "- Compliance: ${{ needs.compliance.result }}" >> security-report.md
          echo "## Build Status" >> security-report.md
          echo "- Frontend: ${{ needs.build.result }}" >> security-report.md
          echo "- Redis: ${{ needs.build.result }}" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.md
