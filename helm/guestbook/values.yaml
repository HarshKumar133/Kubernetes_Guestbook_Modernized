# Kubernetes Guestbook Modernized - Default Values
# This file contains the default values for the guestbook Helm chart

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Application configuration
app:
  name: guestbook
  version: "1.0.0"
  environment: "dev"
  replicas: 2
  image:
    repository: guestbook-modernized/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "guestbook-redis-password"
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
    nodeSelector: {}
    tolerations: []
    affinity: {}
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: guestbook.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

# ConfigMap configuration
configMap:
  enabled: true
  data:
    REDIS_HOST: "redis-master"
    REDIS_PORT: "6379"
    REDIS_PASSWORD: "guestbook-redis-password"
    PHP_MEMORY_LIMIT: "128M"
    PHP_MAX_EXECUTION_TIME: "30"
    PHP_UPLOAD_MAX_FILESIZE: "2M"
    PHP_POST_MAX_SIZE: "8M"

# Secret configuration
secret:
  enabled: true
  data:
    redis-password: "guestbook-redis-password"

# Network Policy configuration
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: guestbook
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
  grafana:
    enabled: true
    dashboard:
      enabled: true
      configMap: "guestbook-dashboard"
  alerts:
    enabled: true
    rules: []

# Security configuration
security:
  podSecurityPolicy:
    enabled: false
  networkPolicy:
    enabled: true
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  rbac:
    create: true
    rules: []

# Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

# Rolling update configuration
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
  strategy: RollingUpdate

# Labels and annotations
labels:
  app: guestbook
  version: "1.0.0"
  environment: "dev"
  managed-by: "helm"

annotations:
  deployment.kubernetes.io/revision: "1"
  kubernetes.io/change-cause: "Initial deployment"

# Environment-specific overrides
environments:
  dev:
    app:
      replicas: 1
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
    redis:
      master:
        persistence:
          enabled: false
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
    monitoring:
      enabled: false
    security:
      networkPolicy:
        enabled: false
  
  staging:
    app:
      replicas: 2
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
    redis:
      master:
        persistence:
          enabled: true
          size: "4Gi"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
    monitoring:
      enabled: true
      prometheus:
        enabled: true
      grafana:
        enabled: true
    security:
      networkPolicy:
        enabled: true
  
  production:
    app:
      replicas: 3
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "400m"
    redis:
      master:
        persistence:
          enabled: true
          size: "20Gi"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "400m"
      replica:
        replicaCount: 2
        persistence:
          enabled: true
          size: "20Gi"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "400m"
    monitoring:
      enabled: true
      prometheus:
        enabled: true
      grafana:
        enabled: true
      alerts:
        enabled: true
    security:
      networkPolicy:
        enabled: true
      podSecurityPolicy:
        enabled: true
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 70
