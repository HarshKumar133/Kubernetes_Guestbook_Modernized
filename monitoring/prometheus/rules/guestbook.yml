# Prometheus Alerting Rules for Kubernetes Guestbook Modernized
# Comprehensive alerting rules for application monitoring

groups:
  - name: guestbook.rules
    rules:
      # Application availability
      - alert: GuestbookDown
        expr: up{job="guestbook"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Guestbook application is down"
          description: "Guestbook application has been down for more than 1 minute"

      - alert: GuestbookHighErrorRate
        expr: rate(http_requests_total{job="guestbook",code=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in guestbook"
          description: "Error rate is {{ $value }} errors per second"

      # Resource usage
      - alert: GuestbookHighCPU
        expr: rate(container_cpu_usage_seconds_total{container="guestbook"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage in guestbook"
          description: "CPU usage is {{ $value }}%"

      - alert: GuestbookHighMemory
        expr: container_memory_usage_bytes{container="guestbook"} / container_spec_memory_limit_bytes{container="guestbook"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in guestbook"
          description: "Memory usage is {{ $value }}%"

      - alert: GuestbookDiskSpace
        expr: (container_fs_available_bytes{container="guestbook"} / container_fs_size_bytes{container="guestbook"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space in guestbook"
          description: "Disk space is {{ $value }}% available"

      # Pod health
      - alert: GuestbookPodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{container="guestbook"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Guestbook pod is crash looping"
          description: "Pod {{ $labels.pod }} is restarting frequently"

      - alert: GuestbookPodNotReady
        expr: kube_pod_status_phase{phase="Running"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Guestbook pod is not ready"
          description: "Pod {{ $labels.pod }} is not in running state"

      # Redis health
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in Redis"
          description: "Redis memory usage is {{ $value }}%"

      - alert: RedisHighConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of Redis connections"
          description: "Redis has {{ $value }} active connections"

      # Network
      - alert: GuestbookHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="guestbook"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency in guestbook"
          description: "95th percentile latency is {{ $value }}s"

      - alert: GuestbookHighRequestRate
        expr: rate(http_requests_total{job="guestbook"}[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request rate in guestbook"
          description: "Request rate is {{ $value }} requests per second"

      # Business metrics
      - alert: GuestbookLowMessageCount
        expr: redis_list_length{key="guestbook:entries"} < 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low message count in guestbook"
          description: "Guestbook has {{ $value }} messages"

      - alert: GuestbookHighMessageCount
        expr: redis_list_length{key="guestbook:entries"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High message count in guestbook"
          description: "Guestbook has {{ $value }} messages"

  - name: kubernetes.rules
    rules:
      # Node health
      - alert: NodeDown
        expr: up{job="kubernetes-nodes"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node is down"
          description: "Node {{ $labels.instance }} has been down for more than 1 minute"

      - alert: NodeHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on node"
          description: "CPU usage on {{ $labels.instance }} is {{ $value }}%"

      - alert: NodeHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on node"
          description: "Memory usage on {{ $labels.instance }} is {{ $value }}%"

      - alert: NodeDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on node"
          description: "Disk space on {{ $labels.instance }} is {{ $value }}% used"

      # Pod health
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently"

      - alert: PodNotReady
        expr: kube_pod_status_phase{phase="Running"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod is not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not in running state"

      # Deployment health
      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_status_replicas_available != kube_deployment_spec_replicas
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment replicas mismatch"
          description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has {{ $value }} available replicas"

      - alert: DeploymentRolloutStuck
        expr: kube_deployment_status_condition{condition="Progressing",status="False"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment rollout is stuck"
          description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} rollout is stuck"

  - name: infrastructure.rules
    rules:
      # Cluster health
      - alert: ClusterHighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage in cluster"
          description: "Cluster CPU usage is {{ $value }}%"

      - alert: ClusterHighMemory
        expr: (1 - (avg(node_memory_MemAvailable_bytes) / avg(node_memory_MemTotal_bytes))) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in cluster"
          description: "Cluster memory usage is {{ $value }}%"

      # Storage
      - alert: PersistentVolumeClaimFull
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Persistent volume claim is full"
          description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value }}% full"

      # Network
      - alert: HighNetworkErrors
        expr: rate(node_network_receive_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network errors"
          description: "Network interface {{ $labels.device }} on {{ $labels.instance }} has {{ $value }} errors per second"
